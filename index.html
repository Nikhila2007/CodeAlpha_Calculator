<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="A modern glassmorphism calculator with history, themes, and keyboard support."
    />
    <title>Glass Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Decorative background blobs (purely cosmetic) -->
    <div class="bg-decor" aria-hidden="true">
      <span class="blob blob--one"></span>
      <span class="blob blob--two"></span>
      <span class="blob blob--three"></span>
    </div>

    <main class="app">
      <!-- ====================== CALCULATOR CARD ====================== -->
      <section class="calculator" aria-label="Calculator">
        <!-- Top bar: title + theme toggle -->
        <header class="calculator__topbar">
          <h1 class="calculator__title">Calculator</h1>
          <button
            id="themeToggle"
            class="icon-btn"
            type="button"
            aria-label="Toggle light and dark mode"
            title="Toggle theme"
          >
            <span class="icon-btn__label" id="themeLabel">Dark</span>
          </button>
        </header>

        <!-- Display screen -->
        <div class="display" role="status" aria-live="polite">
          <div class="display__expression" id="expression">&nbsp;</div>
          <div class="display__result" id="result">0</div>
        </div>

        <!-- Action row: copy result -->
        <div class="display__actions">
          <button
            id="copyBtn"
            class="text-btn"
            type="button"
            aria-label="Copy result to clipboard"
          >
            Copy result
          </button>
        </div>

        <!-- Button grid -->
        <div class="keys" role="group" aria-label="Calculator buttons">
          <button class="key key--func" data-action="clear" type="button">C</button>
          <button class="key key--func" data-action="delete" type="button" aria-label="Delete">?</button>
          <button class="key key--func" data-value="%" type="button" aria-label="Percentage">%</button>
          <button class="key key--op" data-value="/" type="button" aria-label="Divide">÷</button>

          <button class="key" data-value="7" type="button">7</button>
          <button class="key" data-value="8" type="button">8</button>
          <button class="key" data-value="9" type="button">9</button>
          <button class="key key--op" data-value="*" type="button" aria-label="Multiply">×</button>

          <button class="key" data-value="4" type="button">4</button>
          <button class="key" data-value="5" type="button">5</button>
          <button class="key" data-value="6" type="button">6</button>
          <button class="key key--op" data-value="-" type="button" aria-label="Subtract">-</button>

          <button class="key" data-value="1" type="button">1</button>
          <button class="key" data-value="2" type="button">2</button>
          <button class="key" data-value="3" type="button">3</button>
          <button class="key key--op" data-value="+" type="button" aria-label="Add">+</button>

          <button class="key key--zero" data-value="0" type="button">0</button>
          <button class="key" data-value="." type="button" aria-label="Decimal point">.</button>
          <button class="key key--equals" data-action="equals" type="button" aria-label="Equals">=</button>
        </div>
      </section>

      <!-- ====================== HISTORY PANEL ====================== -->
      <aside class="history" aria-label="Calculation history">
        <div class="history__header">
          <h2 class="history__title">History</h2>
          <button id="clearHistory" class="text-btn" type="button">Clear</button>
        </div>
        <ul class="history__list" id="historyList">
          <li class="history__empty" id="historyEmpty">No calculations yet</li>
        </ul>
      </aside>
    </main>

    <!-- Toast for copy feedback -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
